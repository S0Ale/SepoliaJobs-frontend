<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<link rel="stylesheet" href="./css/home.css">

	<script src="https://kit.fontawesome.com/6de3b8484d.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body x-data="newjobmodal" class="relative w-full font-sans layer0">

	<div x-show="openmodal" class="px-4 flex flex-col justify-center bg-gray-950/30 job-modal absolute top-0 left-0 w-full h-full layer2000">
		<div class="relative bg-white w-full md:w-[425px] h-[450px] sm:mx-auto border border-gray-300">
			<button @click="openmodal = false" class="absolute right-0 top-0 p-2 text-gray-400 hover:text-red-500 transition-[color] duration-250">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
					<path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
				</svg>
			</button>

			<h2 class="mt-10 px-3 py-2 border-t border-gray-300 text-xl">Create new Job</h2>

			<div class="mt-6 px-3">
				<p class="text-gray-400">Title</p>
				<input type="text" name="title" placeholder="Job title" class="w-full px-2 py-1 border border-gray-300 bg-gray-50">
			</div>
			<div class="mt-6 px-3">
				<p class="text-gray-400">Description</p>
				<input type="text" name="desc" placeholder="Job description" class="w-full px-2 py-1 border border-gray-300 bg-gray-50">
			</div>
			<div x-data="deadlinePicker" class="mt-6 px-3 flex flex-col">
				<label for="deadline" class="text-gray-400">Deadline</label>
				<input
				type="datetime-local"
				id="deadline"
				x-model="localValue"
				:min="minDateTime"
				class="border border-gray-300 rounded px-3 py-2 text-gray-400 bg-gray-50"
				/>
				<span class="text-xs text-gray-500" x-show="localValue">
					Unix timestamp: <span x-text="unixTimestamp"></span>
				</span>
			</div>

			<button @click="" class="std-button absolute bottom-4 right-4 px-3 py-2">Create job</button>
		</div>
	</div>
	<nav class="top-0 fixed w-full h-16 px-6 md:px-24 flex row justify-between border-b border-gray-300 bg-white layer1000">
		<header class="relative flex items-center text-xl font-bold">
			<a href="/home.html" class="absolute w-full h-full top-0 left-0"></a>
			Sepolia Jobs
		</header>
		<div x-data="account" class="flex items-center text-sm">
			<span class="mr-2">Address:</span>
			<span x-text="formattedAddr"></span>
		</div>
	</nav>
	<main class="relative mt-16 layer-1 grid grid-cols-[0_1fr_0] sm:grid-cols-[4rem_1fr_4rem] md:grid-cols-[12rem_1fr_12rem] lg:grid-cols-[16rem_1fr_16rem] 2xl:grid-cols-[20rem_1fr_20rem] grid-rows-[1fr] gap-0">
		<div class="margin"></div>
		<div class="flex flex-col border border-y-0 border-gray-300">
			<section class="sector mt-32">
				<div class="p-3">
					<h2 class="text-4xl">Job list</h2>
				</div>
			</section>

			<section class="sector mt-0 border-t-0">
				<div class="flex flex-row">
					<div class="search-cont relative flex flex-row">
						<svg class="search w-8 p-1.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
							<path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/>
						</svg>
						<input id="search" name="jobsearch" type="text" placeholder="Search" class="p-2 pr-7 h-8 min-w-48 max-w-72 bg-gray-50 border-x border-gray-300">

						<svg class="return absolute h-full w-8 right-0 p-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
							<path stroke-linecap="round" stroke-linejoin="round" d="m7.49 12-3.75 3.75m0 0 3.75 3.75m-3.75-3.75h16.5V4.499" />
						</svg>
					</div>
				</div>
			</section>

			<section class="segment relative sector mt-12 p-3 grid grid-cols-2 gap-3 bg-[#f7f7f7]">
				<div class="flex flex-row justify-between absolute pl-2 w-full bottom-[100%]">
					<span class="seg-title text-md text-gray-400 noselect">Your jobs</span>

					<button class="px-2 text-gray-400 hover:text-blue-600 transition-[color] duration-250" @click="openmodal = true">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
							<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
						</svg>
					</button>
				</div>

				<template x-data="jobtemplate" x-for="job in $store.userjobs">
					<div x-data="{deadline: formatDate(job.deadline), type: getJobType(job)}" @click="redirectJob(job)" class="job-card relative flex flex-row justify-between p-3 cursor-pointer">
						<div class="flex flex-col">
							<h3 x-text="job.title" class="noselect"></h3>
							<span x-text="type" class="text-sm text-gray-400 transition-[color] duration-250"></span>
						</div>
						<span x-text="deadline" class="text-sm flex flex-col justify-center text-gray-400"></span>
					</div>
				</template>
			</section>

			<section class="segment relative sector mt-24 mb-4 p-3 grid grid-cols-2 gap-3 bg-[#f7f7f7]">
				<span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Recent jobs</span>

				<template x-data="jobtemplate" x-for="job in $store.jobs">
                    <div x-data="{deadline: formatDate(job.deadline)}" @click="redirectJob(job)" class="job-card relative flex flex-row justify-between p-3 cursor-pointer">
						<div class="flex flex-col">
							<h3 x-text="job.title" class="noselect"></h3>
						</div>
						<span x-text="deadline" class="text-sm flex flex-col justify-center text-gray-400"></span>
					</div>
				</template>
			</section>
		</div>

		<div class="margin"></div>
	</main>
	<footer class="h-32 border-t border-gray-300"></footer>

	<script type="module" src="./js/init.js"></script>
	<script type="module" src="./js/home.js"></script>
	<script type="module" src="./js/alpine-init.js"></script>
</body>
</html>

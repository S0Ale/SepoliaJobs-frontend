<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<link rel="stylesheet" href="./css/connect.css">

	<script src="https://kit.fontawesome.com/6de3b8484d.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full min-h-screen font-sans">
	<nav class="w-full h-16 px-24 flex row border-b border-gray-300">
		<header class="flex items-center text-xl font-bold">Sepolia Jobs</header>
	</nav>
	<main x-data="initLogin" class="grid grid-cols-[20rem_1fr_20rem] grid-rows-[1fr] gap-0">
		<div class="margin"></div>
		<div class="flex flex-col justify-center border border-y-0 border-gray-300">
			<div class="mx-auto mb-12 w-fit flex flex-col items-center">
				<span class="mb-8 text-2xl">Freelance work, secured by smart contracts.</span>
				<button @click="connectF()" class="px-4 py-2 border border-gray-300 bg-blue-600 text-white hover:bg-blue-500">
					Connect Wallet
				</button>
			</div>
			<p x-show="$store.login.showerror" x-html="$store.login.msg"></p>
		</div>
		<div class="margin"></div>
	</main>


	<script type="module" src="./js/init.js"></script>
	<script type="module" src="./js/connect-page.js"></script>
	<script type="module" src="./js/alpine-init.js"></script>
</body>
</html>

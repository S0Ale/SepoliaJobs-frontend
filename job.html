<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<link rel="stylesheet" href="./css/job.css">

	<script src="https://kit.fontawesome.com/6de3b8484d.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full font-sans">
	<nav class="top-0 fixed w-full h-16 px-6 md:px-24 flex row justify-between border-b border-gray-300 bg-white layer1000">
		<header class="relative flex items-center text-xl font-bold">
			<a href="/home.html" class="absolute w-full h-full top-0 left-0"></a>
			Sepolia Jobs
		</header>
		<div x-data="account" class="flex items-center text-sm">
			<span class="mr-2">Address:</span>
			<span x-text="formattedAddr"></span>
		</div>
	</nav>
	<main x-data="submitmodal" class="relative mt-16 layer-1 grid grid-cols-[0_1fr_0] sm:grid-cols-[4rem_1fr_4rem] md:grid-cols-[12rem_1fr_12rem] lg:grid-cols-[16rem_1fr_16rem] 2xl:grid-cols-[20rem_1fr_20rem] grid-rows-[1fr] gap-0">

		<div x-data="submitform" x-show="openmodal" class="px-4 flex flex-col justify-center bg-gray-950/30 job-modal absolute top-0 left-0 w-full h-full layer2000">
			<div class="relative bg-white w-full md:w-[425px] h-fit sm:mx-auto border border-gray-300">
				<button @click="openmodal = false" class="absolute right-0 top-0 p-2 text-gray-400 hover:text-red-500 transition-[color] duration-250">
					<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
						<path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
					</svg>
				</button>

				<h2 class="mt-10 px-3 py-2 border-t border-gray-300 text-xl">Submit work</h2>

				<form id="submit-form" @submit.prevent="submitFiles">
					<div class="my-2 px-3">
						<label for="filesubmit" class="text-gray-400">Choose file to submit:</label>
						<input type="file" name="filesubmit" class="text-gray-500" multiple x-on:change="files = Object.values($event.target.files)"/>
					</div>
					<div x-show="files" class="mx-3 border-t border-gray-300">
						<template x-for="f of files">
							<p x-text="f.name" class="text-gray-500 text-sm"></p>
						</template>
					</div>

					<p x-show="modalerror" x-text="errormsg" class="mt-4 text-red-500 px-3 text-sm"></p>
					<div class="mt-4 flex flex-row pr-4 pb-4 justify-end">
						<button type="submit" class="std-button exclusive-btn h-fit px-3 py-2" :class="$store.loading ? 'btn-inactive' : ''">Submit</button>
					</div>
				</form>
			</div>
		</div>

		<div class="margin"></div>
		<div x-data="loadstate" class="flex flex-col border border-y-0 border-gray-300">
			<section class="sector mt-24">
				<div x-data class="p-3">
					<h2 x-text="'Job: '+$store.jobdata.title" class="text-2xl"></h2>
				</div>
			</section>
			<section class="segment relative sector mt-12 bg-[#f7f7f7]">
				<span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Description</span>
				<p x-data x-text="$store.jobdata.desc" class="p-2"></p>
			</section>
            <section class="segment flex flex-row relative sector mt-12 bg-[#f7f7f7]">
                <span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Info</span>
                <div class="mt-4 mr-10 w-fit">
                    <span class="px-2 text-md noselect"> Payment:</span>
				    <p x-data x-text="$store.jobdata.payment + ' ETH'" class="ml-[1px] px-2 py-2"></p>
                </div>
                <div class="mt-4 mr-10 w-fit">
                    <span class="px-2 text-md noselect"> Deadline:</span>
				    <p x-data x-text="$store.jobdata.deadline" class="px-2 py-2"></p>
                </div>
                <div class="mt-4 w-fit">
                    <p class="px-2 text-md noselect"> Status:</p>
                    <div x-data class="ml-2 mt-2 mb-4 text-center border-2" :class="$store.jobdata.stateClass">
                        <p x-text="$store.jobdata.state" class="mx-auto px-2 py-2"></p>
                    </div>
                </div>
            </section>
            <section x-data  x-show="$store.state.applicationsNotEmpty" class="segment relative sector mt-12">
				<span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Applications</span>
				<template x-data="eventtemplate" x-for="(e, index) in $store.events">
					<div x-data="{date: formatDate(e.timestamp)}" class="relative p-3 border-b border-gray-300 last:border-b-0 text-gray-400 bg-[#f7f7f7]">
						<div class="flex flex-col sm:flex-row justify-between">
							<div x-data="{extratext: formatExtraInfo(e.extrainfo)}">
								<p x-show="e.extrainfo != null" x-text="extratext" class="mb-2 text-[#555555]"></p>
                                <p x-text="date" class="text-sm"></p>
							</div>
                            <button x-data="job" @click="loadtrue();accept(e.extrainfo.freelancer);loadfalse()" class="std-button h-fit mr-1 px-3 py-2" :class="$store.loading ? 'btn-inactive' : ''">Accept</button>
						</div>
					</div>
				</template>
			</section>
		    <section x-data="job" class="segment flex flex-row-reverse mt-6 pr-2">
                <button x-show="$store.state.isAssignable" @click="loadtrue();await apply();loadfalse()" class="std-button h-fit mx-2 px-3 py-2" :class="$store.loading ? 'btn-inactive' : ''">Apply</button>
                <button x-show="$store.state.isSubmittable" @click="openmodal = true" class="std-button h-fit mx-2 px-3 py-2">Submit</button>
                <button x-show="$store.state.isRefundable" @click="loadtrue();await ref();loadfalse()" class="std-button h-fit mx-2 px-3 py-2" :class="$store.loading ? 'btn-inactive' : ''">Refund</button>
                <button x-show="$store.state.isDeletable" @click="loadtrue();await del();loadfalse()" class="danger-button h-fit mx-2 px-3 py-2" :class="$store.loading ? 'btn-inactive' : ''">Delete</button>
            </section>
        </div>

		<div class="margin"></div>
	</main>
	<footer class="h-32 border-t border-gray-300"></footer>

	<script type="module" src="./js/init.js"></script>
	<script type="module" src="./js/job.js"></script>
	<script type="module" src="./js/alpine-init.js"></script>
</body>
</html>

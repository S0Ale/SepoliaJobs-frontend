<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<link rel="stylesheet" href="./css/job.css">

	<script src="https://kit.fontawesome.com/6de3b8484d.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full font-sans">
	<nav class="top-0 fixed w-full h-16 px-6 md:px-24 flex row justify-between border-b border-gray-300 bg-white layer1000">
		<header class="relative flex items-center text-xl font-bold">
			<a href="/home.html" class="absolute w-full h-full top-0 left-0"></a>
			Sepolia Jobs
		</header>
		<div x-data="account" class="flex items-center text-sm">
			<span class="mr-2">Address:</span>
			<span x-text="formattedAddr"></span>
		</div>
	</nav>
	<main class="relative mt-16 layer-1 grid grid-cols-[0_1fr_0] sm:grid-cols-[4rem_1fr_4rem] md:grid-cols-[12rem_1fr_12rem] lg:grid-cols-[16rem_1fr_16rem] 2xl:grid-cols-[20rem_1fr_20rem] grid-rows-[1fr] gap-0">

		<div class="margin"></div>
		<div class="flex flex-col border border-y-0 border-gray-300">
			<section class="sector mt-24">
				<div x-data class="p-3">
					<h2 x-text="'Job: '+$store.jobdata.title" class="text-2xl"></h2>
				</div>
			</section>
			<section class="segment relative sector mt-12 bg-[#f7f7f7]">
				<span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Description</span>
				<p x-data x-text="$store.jobdata.desc" class="p-2"></p>
			</section>
            <section class="segment flex flex-row relative sector mt-12 bg-[#f7f7f7]">
                <span class="seg-title absolute px-2 bottom-[100%] text-md text-gray-400 noselect">Info</span>
                <div class="mt-2 mr-10 w-fit">
                    <span class="px-2 text-md noselect"> Payment:</span>
				    <p x-data x-text="$store.jobdata.payment + ' ETH'" class="px-2 py-4"></p>
                </div>
                <div class="mt-2 mr-10 w-fit">
                    <span class="px-2 text-md noselect"> Deadline:</span>
				    <p x-data x-text="$store.jobdata.deadline" class="px-2 py-4"></p>
                </div>
                <div class="mt-2 w-fit">
                    <p class="px-2 text-md noselect"> Status:</p>
                    <div x-data class="ml-2 mt-2 mb-3 text-center border-2" :class="$store.jobdata.stateClass">
                        <p x-text="$store.jobdata.state" class="mx-auto px-2 py-2"></p>
                    </div>
                </div>
            </section>
		</div>

		<div class="margin"></div>
	</main>
	<footer class="h-32 border-t border-gray-300"></footer>

	<script type="module" src="./js/init.js"></script>
	<script type="module" src="./js/job.js"></script>
	<script type="module" src="./js/alpine-init.js"></script>
</body>
</html>
